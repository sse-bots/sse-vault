name: Build SSE Vault Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Android version name (for example 1.2.0). Leave blank to use 1.0.RUN_NUMBER."
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Add and sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android version and signing configuration
        shell: bash
        env:
          REQUESTED_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "$REQUESTED_VERSION_NAME" ]]; then
            VERSION_NAME="$REQUESTED_VERSION_NAME"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version name: $VERSION_NAME. Use x.y.z, such as 1.2.0."
            exit 1
          fi

          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD repository secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS repository secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD repository secret}"

          mkdir -p android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/sse-vault-release.jks

          VERSION_CODE="$GITHUB_RUN_NUMBER" VERSION_NAME="$VERSION_NAME" python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          addition = '''\n\n// SSE Vault CI release signing and monotonically increasing version.\nandroid {\n    signingConfigs {\n        release {\n            storeFile file("keystore/sse-vault-release.jks")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n    defaultConfig {\n        versionCode Integer.parseInt(System.getenv("VERSION_CODE"))\n        versionName System.getenv("VERSION_NAME")\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\n'''
          if "SSE Vault CI release signing" in s:
              raise SystemExit("Signing configuration was already injected; refusing duplicate configuration")
          p.write_text(s + addition)
          PY

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk "release-output/SSE-Vault-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSE-Vault-${{ github.run_number }}
          path: release-output/SSE-Vault-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/SSE-Vault-${{ env.VERSION_NAME }}.apk
          fail_on_unmatched_files: true
